[package]
name = "stitch-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "egui adapter for the scan-to-img workbench"

[dependencies]
stitch-domain.workspace = true
stitch-application.workspace = true
stitch-ui-core.workspace = true
stitch-renderer-wgpu.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
eframe.workspace = true
log.workspace = true

# Native menu bar and Open/Save panels on macOS. Linux keeps the in-app
# dialog, which needs no GTK or portal libraries.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
rfd = { version = "0.18", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
