[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/vision",
    "crates/imaging",
    "crates/ui-core",
    "crates/renderer-wgpu",
    "crates/ui-egui",
    "crates/testkit",
    "crates/contract-tests",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Source-available license"
rust-version = "1.95"
authors = ["Andrej Georgievski"]

[workspace.dependencies]
stitch-domain = { path = "crates/domain" }
stitch-application = { path = "crates/application" }
stitch-vision = { path = "crates/vision" }
stitch-imaging = { path = "crates/imaging" }
stitch-ui-core = { path = "crates/ui-core" }
stitch-renderer-wgpu = { path = "crates/renderer-wgpu" }
stitch-ui-egui = { path = "crates/ui-egui" }
stitch-testkit = { path = "crates/testkit" }

thiserror = "2"
log = "0.4"
env_logger = "0.11"
rayon = "1.11"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "tiff",
] }
egui = "0.37.0"
egui-wgpu = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "x11",
    "wayland",
    "accesskit",
] }
wgpu = "30.0"
bytemuck = { version = "1.23", features = ["derive"] }
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 2
